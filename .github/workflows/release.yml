name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -platform darwin/universal -clean -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}"
      - run: ditto -c -k --keepParent build/bin/grove.app grove-darwin-universal.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: grove-darwin-universal.zip
      - name: Update Homebrew cask
        env:
          # PAT with `repo` scope on StuStirling/homebrew-tap (GITHUB_TOKEN cannot
          # push to a different repo).
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 grove-darwin-universal.zip | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/StuStirling/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/grove.rb <<EOF
          cask "grove" do
            version "${version}"
            sha256 "${sha}"

            url "https://github.com/StuStirling/grove/releases/download/v#{version}/grove-darwin-universal.zip"
            name "grove"
            desc "Git-worktree switcher"
            homepage "https://github.com/StuStirling/grove"

            app "grove.app"
            binary "#{appdir}/grove.app/Contents/MacOS/grove"

            # Unsigned: strip the quarantine bit so the app opens after install.
            postflight do
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{appdir}/grove.app"]
            end
          end
          EOF
          cd tap
          git add Casks/grove.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "grove ${version}"
          git push

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -tags webkit2_41 -clean -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}"
      - run: tar -C build/bin -czf "grove_${GITHUB_REF_NAME#v}_linux_${{ matrix.arch }}.tar.gz" grove
      - uses: softprops/action-gh-release@v2
        with:
          files: grove_*_linux_*.tar.gz
