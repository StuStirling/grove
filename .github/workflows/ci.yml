name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: macos-latest
            tags: ""
          - os: ubuntu-latest
            tags: webkit2_41
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # The Go binary embeds frontend/dist, so build it before any Go step.
      - run: npm ci && npm run build
        working-directory: frontend
      - run: go vet -tags "${{ matrix.tags }}" ./...
      - run: go test -tags "${{ matrix.tags }}" ./...
      - run: go build -tags "desktop,production,${{ matrix.tags }}" ./...
